tagline: Director / Producer
aboutHeadline: A director who produces — and a producer who shoots, cuts and grades. One person from brief to final delivery.
aboutText: |-
  I’m Chee Choon, a director and producer based in Singapore.

  I like making things that are a bit playful. A lot of my work leans into comedy and performance, and I enjoy mixing live action with animation or VFX when the idea calls for it. I studied communication and spent a good while making social content, so I tend to think about what actually holds people’s attention.

  So far I’ve done brand campaigns, documentaries, kids’ shows for Mediacorp, corporate and school videos, and some feature film work. I’ve shot in Singapore, Cambodia, Thailand and Vietnam. Whether the project is light or more personal, I try to keep it fun to watch without losing what it’s really about.

  On the producing side, I’ve handled budgets big and small. My job there is making the money work so the film doesn’t suffer for it.
